name: Snake

# Draws the snake that eats the contribution graph, in the profile's colours,
# and publishes it to the "output" branch that the README points at.

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#A8650C&color_dots=#ebedf0,#d6d1f5,#ab9fec,#7f6fe0,#5443d1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F6D9A6&color_dots=#161b22,#2b2f6b,#4a40a6,#6c5fd8,#8b7bf5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
