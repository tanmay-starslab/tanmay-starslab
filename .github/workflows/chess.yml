name: Community chess

# Plays a move whenever someone opens an issue titled "chess|move|<uci>" from
# the links in the README, then replies and closes the issue.
#
# Issue titles and logins are untrusted. They reach the script only through
# environment variables and are never interpolated into shell commands.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_USER: ${{ github.event.issue.user.login }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Play the move
        env:
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two people can move at once. If our push loses the race, start over
          # from the new position: the script then judges the move against it.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python scripts/chess_game.py from-issue
            git add chess README.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Chess: move from issue #$ISSUE_NUMBER"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "The board changed too many times while this move was being played." > "$REPLY_FILE"
          exit 1

      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          if [ ! -s "$REPLY_FILE" ]; then
            echo "Something went wrong while playing this move. Please try again from the profile." > "$REPLY_FILE"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
