name: Refresh profile

# Redraws the animated activity figure, the moon and sunset badges, and swaps
# in NASA's picture of the day.
# Runs every morning, on demand, and whenever the scripts change.

on:
  schedule:
    # Hourly on purpose. GitHub's cron is best-effort: runs are delayed by
    # hours or dropped when runners are busy, so a once-a-day schedule can
    # silently skip a day. Every run is idempotent and commits only when
    # something changed, so frequent runs cost nothing. The watchdog
    # workflow re-dispatches this one if it still falls behind.
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-profile]
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild static figures
        run: python scripts/build_static.py

      - name: Refresh live data
        env:
          # Optional secrets. STATS_TOKEN (a personal access token) lets the
          # activity figure count pull requests in private repositories;
          # NASA_API_KEY avoids the shared DEMO_KEY rate limit. Both fall back
          # gracefully when unset.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/refresh.py

      - name: Commit and push
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Refresh profile figures and README"
          # Another push may have landed meanwhile; replay on top of it.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
