<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="rocket"><title>rocket</title><style>@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}.flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .25s ease-in-out infinite}@keyframes puff{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(-10px,10px)}}.puff{opacity:0;animation:puff 1.2s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="48" cy="48" r="46" fill="#151E52"/><circle cx="48" cy="48" r="45" fill="none" stroke="#2A3466" stroke-width="2"/><g class="bob"><g transform="translate(48 46) rotate(35)"><path class="flame" d="M-7,22 Q0,44 7,22 Z" fill="#E6B566"/><path d="M0,-30 C12,-18 13,4 9,22 H-9 C-13,4 -12,-18 0,-30 Z" fill="#EEF0FA"/><circle cy="-6" r="5.5" fill="#8B7BF5" stroke="#0B1030" stroke-width="2"/><path d="M-9,10 L-18,24 L-9,22 Z M9,10 L18,24 L9,22 Z" fill="#8B7BF5"/></g></g><circle class="puff" cx="30" cy="72" r="3" fill="#9AA2C6" style="animation-delay:0.0s"/><circle class="puff" cx="24" cy="77" r="4" fill="#9AA2C6" style="animation-delay:0.25s"/><circle class="puff" cx="18" cy="82" r="5" fill="#9AA2C6" style="animation-delay:0.5s"/></svg>
