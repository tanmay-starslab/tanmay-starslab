<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="pulsar"><title>pulsar</title><style>@keyframes beams{to{transform:rotate(360deg)}}.beams{animation:beams 2.2s linear infinite}@keyframes ring{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}.ring{animation:ring 1.1s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="48" cy="48" r="46" fill="#151E52"/><circle cx="48" cy="48" r="45" fill="none" stroke="#2A3466" stroke-width="2"/><defs><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B7ADFF"/><stop offset="1" stop-color="#B7ADFF" stop-opacity="0"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#B7ADFF" stop-opacity=".8"/><stop offset="1" stop-color="#B7ADFF" stop-opacity="0"/></radialGradient></defs><g transform="translate(48 48)"><circle class="ring" r="24" fill="url(#gl)"/><g class="beams"><path d="M0,0 L-9,-46 Q0,-50 9,-46 Z" fill="url(#beam)"/><g transform="rotate(180)"><path d="M0,0 L-9,-46 Q0,-50 9,-46 Z" fill="url(#beam)"/></g></g><circle r="7" fill="#FFFFFF"/></g></svg>
